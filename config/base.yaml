runtime:
  environment: production
  debug: false

api:
  title: SentinelAI API
  host: 0.0.0.0
  port: 8000
  prefix: /api/v1
  docs_enabled: true
  cors_origins: []

database:
  operational_path: data/runtime/behavioral_security.db
  evaluation_path: data/evaluation/ground_truth.db
  busy_timeout_ms: 5000
  wal_enabled: true

logging:
  level: INFO
  format: json
  service_name: behavioral-security-api

randomness:
  seed: 1729
  deterministic_torch: true

intelligence:
  model_path: artifacts/models/fast/model.joblib
  events_path: data/samples/honeywell_demo/events.csv
  metrics_path: artifacts/models/fast/metrics.json
  alert_threshold: 55.0
  replay_interval_ms: 100
  recent_limit: 100

investigation:
  provider: ollama
  model: llama3.1:8b
  base_url: http://127.0.0.1:11434
  timeout_seconds: 3.0
  retry_cooldown_seconds: 30
