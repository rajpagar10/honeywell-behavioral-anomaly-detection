runtime:
  environment: development
  debug: false

api:
  title: SentinelAI API
  host: 127.0.0.1
  port: 8000
  prefix: /api/v1
  docs_enabled: true
  cors_origins:
    - http://127.0.0.1:8501
    - http://localhost:8501

database:
  operational_path: data/runtime/behavioral_security.db
  evaluation_path: data/evaluation/ground_truth.db
  busy_timeout_ms: 5000
  wal_enabled: true

logging:
  level: INFO
  format: console
  service_name: behavioral-security-api

randomness:
  seed: 1729
  deterministic_torch: true
