[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-security-platform"
version = "0.2.0"
description = "Enterprise behavioral anomaly detection platform for SOC operations."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary - Hackathon Evaluation" }
authors = [{ name = "Honeywell Campus Connect Team" }]
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic>=2.11,<3.0",
    "python-dotenv>=1.1,<2.0",
    "PyYAML>=6.0.2,<7.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3.0",
    "mypy>=1.16,<2.0",
    "pytest>=8.4,<10.0",
    "pytest-cov>=6.2,<8.0",
    "ruff>=0.12,<1.0",
    "types-PyYAML>=6.0.12,<7.0",
]
ml = [
    "joblib>=1.4,<2.0",
    "numpy>=2.1,<2.4",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.6,<2.0",
]
ml-advanced = [
    "lightgbm>=4.6,<5.0",
    "torch>=2.7,<3.0",
    "xgboost>=3.0,<4.0",
]
dashboard = [
    "plotly>=6.0,<7.0",
    "streamlit>=1.46,<2.0",
]

[project.scripts]
badp = "behavioral_security.cli:main"

[tool.setuptools]
package-dir = { "" = "backend/src" }

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=behavioral_security --cov-report=term-missing"
testpaths = ["backend/tests"]

[tool.coverage.run]
branch = true
source = ["behavioral_security"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "N", "SIM", "UP"]
ignore = ["D202", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/src", "backend/tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "yaml",
    "dotenv",
    "joblib",
    "numpy",
    "numpy.*",
    "pandas",
    "pandas.*",
    "sklearn",
    "sklearn.*",
    "torch",
]
follow_imports = "skip"
ignore_missing_imports = true
